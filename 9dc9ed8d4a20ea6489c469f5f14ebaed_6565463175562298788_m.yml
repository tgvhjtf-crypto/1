name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 仓库根目录放一张 icon.png 就会替换默认图标；没有则使用工程内自带的
      - name: Use custom icon (optional)
        run: |
          if [ -f icon.png ]; then
            mkdir -p StretchBox/app/src/main/res/drawable
            cp icon.png StretchBox/app/src/main/res/drawable/icon.png
            echo "using custom icon.png"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: StretchBox
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: StretchBox-apk
          path: StretchBox/app/build/outputs/apk/debug/app-debug.apk
