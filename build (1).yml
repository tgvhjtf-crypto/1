name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Generate project
      run: |
        mkdir -p "$(dirname 'StretchBox/app/build.gradle.kts')"
        cat > 'StretchBox/app/build.gradle.kts' <<'STRETCH_EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.example.stretchbox"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.example.stretchbox"
                minSdk = 30
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            buildFeatures { aidl = true }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }

        dependencies {
            implementation("dev.rikka.shizuku:api:13.1.5")
            implementation("dev.rikka.shizuku:provider:13.1.5")
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/AndroidManifest.xml')"
        cat > 'StretchBox/app/src/main/AndroidManifest.xml' <<'STRETCH_EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

            <!-- 允许列出可启动的应用（不需要 QUERY_ALL_PACKAGES） -->
            <queries>
                <intent>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent>
            </queries>

            <application
                android:allowBackup="false"
                android:label="拉伸容器"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".StretchActivity"
                    android:exported="false"
                    android:launchMode="singleTask"
                    android:screenOrientation="sensorLandscape"
                    android:resizeableActivity="true"
                    android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|density" />

                <provider
                    android:name="rikka.shizuku.ShizukuProvider"
                    android:authorities="${applicationId}.shizuku"
                    android:enabled="true"
                    android:exported="true"
                    android:multiprocess="false"
                    android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
            </application>
        </manifest>
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/aidl/com/example/stretchbox/IStretchService.aidl')"
        cat > 'StretchBox/app/src/main/aidl/com/example/stretchbox/IStretchService.aidl' <<'STRETCH_EOF'
        package com.example.stretchbox;

        import android.view.Surface;
        import android.view.MotionEvent;

        /** 运行在 Shizuku（shell 权限）进程中的服务接口 */
        interface IStretchService {
            /** Shizuku 要求的销毁方法，事务号固定 */
            void destroy() = 16777114;

            /** 创建（或复用）虚拟屏，画面输出到 surface，返回 displayId；失败抛异常 */
            int createDisplay(int width, int height, int dpi, float refreshRate, in Surface surface) = 1;
            void resizeDisplay(int width, int height, int dpi) = 2;
            /** surface 可为 null（暂停输出） */
            void setSurface(in Surface surface) = 3;
            void releaseDisplay() = 4;

            /** 把应用启动到指定虚拟屏，返回 am 输出 */
            String launch(String pkg, int displayId, boolean forceStop) = 5;

            oneway void injectTouch(int displayId, in MotionEvent event) = 6;
            oneway void injectKey(int displayId, int keyCode) = 7;
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/MainActivity.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/MainActivity.kt' <<'STRETCH_EOF'
        package com.example.stretchbox

        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.graphics.Typeface
        import android.os.Bundle
        import android.view.Gravity
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ArrayAdapter
        import android.widget.Button
        import android.widget.CheckBox
        import android.widget.EditText
        import android.widget.HorizontalScrollView
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.Spinner
        import android.widget.TextView
        import android.widget.Toast
        import android.text.InputType
        import android.widget.AdapterView
        import rikka.shizuku.Shizuku
        import kotlin.math.max
        import kotlin.math.min
        import kotlin.math.roundToInt

        class MainActivity : Activity() {

            private lateinit var statusText: TextView
            private lateinit var statusBtn: Button
            private lateinit var gameSpinner: Spinner
            private lateinit var etW: EditText
            private lateinit var etH: EditText
            private lateinit var etDpi: EditText
            private lateinit var cbForceStop: CheckBox
            private lateinit var hzSpinner: Spinner

            private var apps: List<Pair<String, String>> = emptyList() // pkg to label
            private var shortSide = 1080
            private var baseDpi = 420

            private val binderListener = Shizuku.OnBinderReceivedListener { runOnUiThread { refresh() } }
            private val deadListener = Shizuku.OnBinderDeadListener { runOnUiThread { refresh() } }
            private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ -> runOnUiThread { refresh() } }

            private val prefs by lazy { getSharedPreferences("cfg", Context.MODE_PRIVATE) }

            private fun dp(v: Int) = (v * resources.displayMetrics.density).roundToInt()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                                val crashPrefs = getSharedPreferences("crash", Context.MODE_PRIVATE)
                Thread.setDefaultUncaughtExceptionHandler { _, e ->
                    crashPrefs.edit().putString("log", android.util.Log.getStackTraceString(e)).commit()
                    android.os.Process.killProcess(android.os.Process.myPid())
                }
                crashPrefs.getString("log", null)?.let {
                    crashPrefs.edit().remove("log").apply()
                    android.app.AlertDialog.Builder(this)
                        .setTitle("上次崩溃日志")
                        .setMessage(it.take(4000))
                        .setPositiveButton("确定", null)
                        .show()
                }
                                try {
                    val am = getSystemService(android.app.ActivityManager::class.java)
                    val info = am.getHistoricalProcessExitReasons(packageName, 0, 1).firstOrNull()
                    if (info != null && info.timestamp > crashPrefs.getLong("exitTs", 0L)) {
                        crashPrefs.edit().putLong("exitTs", info.timestamp).apply()
                        android.app.AlertDialog.Builder(this)
                            .setTitle("上次退出原因")
                            .setMessage("reason=${info.reason} status=${info.status}\n${info.description}")
                            .setPositiveButton("确定", null)
                            .show()
                    }
                } catch (_: Throwable) {}
                val b = windowManager.currentWindowMetrics.bounds
                shortSide = min(b.width(), b.height())
                baseDpi = resources.displayMetrics.densityDpi

                buildUi()
                loadApps()
                restorePrefs()

                Shizuku.addBinderReceivedListenerSticky(binderListener)
                Shizuku.addBinderDeadListener(deadListener)
                Shizuku.addRequestPermissionResultListener(permListener)
            }

            override fun onResume() { super.onResume(); refresh() }

            override fun onDestroy() {
                super.onDestroy()
                Shizuku.removeBinderReceivedListener(binderListener)
                Shizuku.removeBinderDeadListener(deadListener)
                Shizuku.removeRequestPermissionResultListener(permListener)
            }

            // ---------------- UI ----------------

            private fun label(text: String) = TextView(this).apply {
                this.text = text; textSize = 14f; setTypeface(typeface, Typeface.BOLD)
                setPadding(0, dp(16), 0, dp(4))
            }

            private fun numberField(hint: String) = EditText(this).apply {
                this.hint = hint; inputType = InputType.TYPE_CLASS_NUMBER; setSingleLine()
            }

            private fun buildUi() {
                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(dp(20), dp(40), dp(20), dp(24))
                }

                root.addView(TextView(this).apply { text = "拉伸容器"; textSize = 26f; setTypeface(typeface, Typeface.BOLD) })

                statusText = TextView(this).apply { setPadding(0, dp(12), 0, dp(4)) }
                statusBtn = Button(this).apply { setOnClickListener { onStatusClick() } }
                root.addView(statusText); root.addView(statusBtn)

                root.addView(label("选择游戏"))
                gameSpinner = Spinner(this)
                root.addView(gameSpinner)

                root.addView(label("虚拟屏比例（游戏看到的分辨率，会被拉伸铺满屏幕）"))
                val presets = listOf(
                    "4:3" to 4.0 / 3, "16:10" to 1.6, "16:9" to 16.0 / 9,
                    "18:9" to 2.0, "19.5:9" to 19.5 / 9, "21:9" to 21.0 / 9, "1:1" to 1.0
                )
                val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                presets.forEach { (name, ratio) ->
                    row.addView(Button(this).apply {
                        text = name; isAllCaps = false
                        setOnClickListener { applyPreset(ratio) }
                    })
                }
                root.addView(HorizontalScrollView(this).apply { addView(row) })

                val wh = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                etW = numberField("宽 px"); etH = numberField("高 px"); etDpi = numberField("DPI")
                listOf(etW, etH, etDpi).forEach {
                    wh.addView(it, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                }
                root.addView(wh)

                cbForceStop = CheckBox(this).apply { text = "启动前强制停止该游戏（推荐，避免它留在主屏）"; isChecked = true }
                root.addView(cbForceStop)

                root.addView(label("虚拟屏帧率（请求值，0 = 自动跟随真屏）"))
                hzSpinner = Spinner(this)
                hzSpinner.adapter = ArrayAdapter(
                    this, android.R.layout.simple_spinner_dropdown_item,
                    listOf("自动（跟随真屏）", "120 Hz", "144 Hz")
                )
                root.addView(hzSpinner)

                root.addView(Button(this).apply {
                    text = "进入容器并启动"; textSize = 16f
                    setOnClickListener { start() }
                }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56)).apply { topMargin = dp(20) })

                root.addView(TextView(this).apply {
                    text = "提示：容器里点右上角半透明按钮可发送返回键或退出。"
                    textSize = 12f; gravity = Gravity.START; setPadding(0, dp(12), 0, 0)
                })

                setContentView(ScrollView(this).apply { addView(root) })
            }

            private fun applyPreset(ratio: Double) {
                val h = shortSide
                val w = (h * ratio / 2).roundToInt() * 2
                etW.setText(w.toString()); etH.setText(h.toString()); etDpi.setText(baseDpi.toString())
            }

            private fun loadApps() {
                val pm = packageManager
                val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                apps = pm.queryIntentActivities(intent, 0)
                    .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                    .filter { it.first != packageName }
                    .distinctBy { it.first }
                    .sortedBy { it.second.lowercase() }
                gameSpinner.adapter = ArrayAdapter(
                    this, android.R.layout.simple_spinner_dropdown_item,
                    apps.map { "${it.second}  (${it.first})" }
                )
                gameSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                    override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {}
                    override fun onNothingSelected(p: AdapterView<*>?) {}
                }
            }

            private fun restorePrefs() {
                val pkg = prefs.getString("pkg", null)
                apps.indexOfFirst { it.first == pkg }.takeIf { it >= 0 }?.let { gameSpinner.setSelection(it) }
                val w = prefs.getInt("w", 0)
                if (w > 0) {
                    etW.setText(w.toString()); etH.setText(prefs.getInt("h", shortSide).toString())
                    etDpi.setText(prefs.getInt("dpi", baseDpi).toString())
                } else applyPreset(16.0 / 9)
                cbForceStop.isChecked = prefs.getBoolean("force", true)
                hzSpinner.setSelection(
                    listOf(0, 120, 144).indexOf(prefs.getInt("hz", 0)).takeIf { it >= 0 } ?: 0
                )
            }

            // ---------------- Shizuku 状态 ----------------

            private fun refresh() {
                when (ServiceClient.status()) {
                    ServiceClient.Status.SHIZUKU_NOT_RUNNING -> {
                        statusText.text = "Shizuku 未运行，请先在 Shizuku App 中启动（无线调试 / ADB / Root）"
                        statusBtn.text = "重新检测"
                    }
                    ServiceClient.Status.NO_PERMISSION -> {
                        statusText.text = "Shizuku 已运行，但本应用尚未授权"
                        statusBtn.text = "授权"
                    }
                    ServiceClient.Status.READY -> {
                        statusText.text = "Shizuku 已连接 ✔"
                        statusBtn.text = "刷新"
                        ServiceClient.bind(this)
                    }
                }
            }

            private fun onStatusClick() {
                if (ServiceClient.status() == ServiceClient.Status.NO_PERMISSION) ServiceClient.requestPermission()
                else refresh()
            }

            // ---------------- 启动 ----------------

            private fun start() {
                if (ServiceClient.status() != ServiceClient.Status.READY) {
                    Toast.makeText(this, "请先连接并授权 Shizuku", Toast.LENGTH_SHORT).show(); return
                }
                val w = etW.text.toString().toIntOrNull()
                val h = etH.text.toString().toIntOrNull()
                val dpi = etDpi.text.toString().toIntOrNull()
                val pos = gameSpinner.selectedItemPosition
                if (w == null || h == null || dpi == null || w < 200 || h < 200 || pos < 0) {
                    Toast.makeText(this, "请填写有效的宽、高、DPI 并选择游戏", Toast.LENGTH_SHORT).show(); return
                }
                val pkg = apps[pos].first
                val hz = listOf(0, 120, 144)[hzSpinner.selectedItemPosition.coerceIn(0, 2)]
                prefs.edit().putString("pkg", pkg).putInt("w", w).putInt("h", h).putInt("dpi", dpi)
                    .putInt("hz", hz)
                    .putBoolean("force", cbForceStop.isChecked).apply()

                startActivity(Intent(this, StretchActivity::class.java).apply {
                    putExtra(StretchActivity.EXTRA_PKG, pkg)
                    putExtra(StretchActivity.EXTRA_W, w)
                    putExtra(StretchActivity.EXTRA_H, h)
                    putExtra(StretchActivity.EXTRA_DPI, dpi)
                    putExtra(StretchActivity.EXTRA_HZ, hz)
                    putExtra(StretchActivity.EXTRA_FORCE_STOP, cbForceStop.isChecked)
                })
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/ServiceClient.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/ServiceClient.kt' <<'STRETCH_EOF'
        package com.example.stretchbox

        import android.content.ComponentName
        import android.content.Context
        import android.content.ServiceConnection
        import android.content.pm.PackageManager
        import android.os.IBinder
        import com.example.stretchbox.service.StretchService
        import rikka.shizuku.Shizuku
        import java.util.concurrent.CopyOnWriteArrayList

        /** App 进程侧：管理 Shizuku 授权 & UserService 的绑定 */
        object ServiceClient {

            enum class Status { SHIZUKU_NOT_RUNNING, NO_PERMISSION, READY }

            const val REQ_CODE = 1001

            @Volatile var service: IStretchService? = null
                private set
            @Volatile private var binding = false
            private val waiters = CopyOnWriteArrayList<(IStretchService) -> Unit>()

            private val conn = object : ServiceConnection {
                override fun onServiceConnected(name: ComponentName, binder: IBinder) {
                    binding = false
                    if (!binder.pingBinder()) return
                    val s = IStretchService.Stub.asInterface(binder)
                    service = s
                    waiters.forEach { it(s) }
                    waiters.clear()
                }

                override fun onServiceDisconnected(name: ComponentName) {
                    service = null
                }
            }

            fun status(): Status = try {
                when {
                    !Shizuku.pingBinder() -> Status.SHIZUKU_NOT_RUNNING
                    Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED -> Status.NO_PERMISSION
                    else -> Status.READY
                }
            } catch (t: Throwable) {
                Status.SHIZUKU_NOT_RUNNING
            }

            fun requestPermission() {
                try { Shizuku.requestPermission(REQ_CODE) } catch (_: Throwable) {}
            }

            fun bind(ctx: Context) {
                if (service != null || binding || status() != Status.READY) return
                binding = true
                val args = Shizuku.UserServiceArgs(ComponentName(ctx.packageName, StretchService::class.java.name))
                    .daemon(false)               // App 退出时 shell 进程一并退出，虚拟屏随之回收
                    .processNameSuffix("stretch")
                    .version(1)
                try { Shizuku.bindUserService(args, conn) } catch (t: Throwable) { binding = false }
            }

            /** 服务已连接就立即回调，否则排队等待（回调在主线程） */
            fun whenReady(cb: (IStretchService) -> Unit) {
                val s = service
                if (s != null) cb(s) else waiters.add(cb)
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/StretchActivity.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/StretchActivity.kt' <<'STRETCH_EOF'
        package com.example.stretchbox

        import android.app.Activity
        import android.app.AlertDialog
        import android.graphics.Color
        import android.graphics.SurfaceTexture
        import android.os.Bundle
        import android.view.Gravity
        import android.view.InputDevice
        import android.view.KeyEvent
        import android.view.MotionEvent
        import android.view.Surface
        import android.view.TextureView
        import android.view.View
        import android.view.ViewGroup
        import android.view.WindowInsets
        import android.view.WindowManager
        import android.widget.FrameLayout
        import android.widget.TextView
        import android.widget.Toast
        import kotlin.concurrent.thread
        import kotlin.math.roundToInt

        /**
         * 容器界面：
         *  - TextureView 铺满整个屏幕，接收虚拟屏输出的画面（缓冲区比例 ≠ View 比例 ⇒ 被强制拉伸）
         *  - 触摸事件按 虚拟屏尺寸 / View 尺寸 缩放坐标后，通过 Shizuku 服务注入到虚拟屏
         */
        class StretchActivity : Activity(), TextureView.SurfaceTextureListener {

            companion object {
                const val EXTRA_PKG = "pkg"
                const val EXTRA_W = "w"
                const val EXTRA_H = "h"
                const val EXTRA_DPI = "dpi"
                const val EXTRA_HZ = "hz"
                const val EXTRA_FORCE_STOP = "force"
            }

            private lateinit var textureView: TextureView
            private lateinit var pkg: String
            private var vdW = 1920
            private var vdH = 1080
            private var dpi = 420
            private var hz = 0
            private var forceStop = true

            private var surface: Surface? = null
            @Volatile private var displayId = -1
            private var launched = false

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                                pkg = intent.getStringExtra(EXTRA_PKG) ?: run { finish(); return }
                vdW = intent.getIntExtra(EXTRA_W, vdW)
                vdH = intent.getIntExtra(EXTRA_H, vdH)
                dpi = intent.getIntExtra(EXTRA_DPI, dpi)
                hz = intent.getIntExtra(EXTRA_HZ, 0)
                forceStop = intent.getBooleanExtra(EXTRA_FORCE_STOP, true)

                goImmersive()

                val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                textureView = TextureView(this).apply {
                    surfaceTextureListener = this@StretchActivity
                    setOnTouchListener { v, ev -> forwardTouch(v, ev); true }
                }
                root.addView(textureView, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)

                val d = resources.displayMetrics.density
                val menu = TextView(this).apply {
                    text = "⋮"; textSize = 20f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                    setBackgroundColor(0x55000000); alpha = 0.5f
                    setOnClickListener { showMenu() }
                }
                root.addView(menu, FrameLayout.LayoutParams((40 * d).roundToInt(), (40 * d).roundToInt(),
                    Gravity.TOP or Gravity.END).apply { topMargin = (8 * d).roundToInt(); rightMargin = (8 * d).roundToInt() })

                setContentView(root)
                ServiceClient.bind(this)
            }

            private fun goImmersive() {
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                window.attributes = window.attributes.apply {
                    layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                    preferredRefreshRate = display?.supportedModes?.maxOfOrNull { it.refreshRate } ?: 0f
                val cur = display?.mode
        val best = display?.supportedModes
            ?.filter { cur != null && it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
            ?.maxByOrNull { it.refreshRate }
        if (best != null) preferredDisplayModeId = best.modeId
                    
                }
                window.setDecorFitsSystemWindows(false)
                window.decorView.windowInsetsController?.apply {
                    hide(WindowInsets.Type.systemBars())
                    systemBarsBehavior = android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                }
            }

            // ---------------- Surface 生命周期 ----------------

            override fun onSurfaceTextureAvailable(st: SurfaceTexture, width: Int, height: Int) {
                st.setDefaultBufferSize(vdW, vdH)          // 缓冲区 = 虚拟屏分辨率
                surface = Surface(st)
                ServiceClient.whenReady { attach(it) }
            }

            private fun attach(svc: IStretchService) {
                val s = surface ?: return
                thread {
                    try {
                    val maxHz = display?.supportedModes?.maxOfOrNull { it.refreshRate } ?: 0f
        val t0 = System.currentTimeMillis()
        while (System.currentTimeMillis() - t0 < 3000 && (display?.refreshRate ?: 0f) < maxHz - 1f) {
            Thread.sleep(100)
        }
        runOnUiThread { Toast.makeText(this, "创建虚拟屏前，真屏刷新率=${display?.refreshRate}Hz", Toast.LENGTH_LONG).show() }
                        displayId = svc.createDisplay(vdW, vdH, dpi, hz.toFloat(), s)
                                                runOnUiThread {
                            val dm = getSystemService(android.hardware.display.DisplayManager::class.java)
                            val vd = dm.getDisplay(displayId)
                            android.app.AlertDialog.Builder(this)
                                .setMessage("系统 SDK=${android.os.Build.VERSION.SDK_INT}\n真屏刷新率=${dm.getDisplay(0).supportedModes.map { it.refreshRate }}\n虚拟屏刷新率=${vd?.refreshRate}\n虚拟屏档位=${vd?.supportedModes?.map { it.refreshRate }}")
                                .setPositiveButton("确定", null).show()
                        }
                        if (!launched) {
                            launched = true
                            val out = svc.launch(pkg, displayId, forceStop)
                            if (out.contains("Error", true) || out.startsWith("ERR") || out.startsWith("找不到"))
                                runOnUiThread { Toast.makeText(this, out, Toast.LENGTH_LONG).show() }
                        }
                    } catch (t: Throwable) {
                        runOnUiThread { Toast.makeText(this, "创建虚拟屏失败: ${t.message}", Toast.LENGTH_LONG).show() }
                    }
                }
            }

            override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, width: Int, height: Int) {}
            override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}

            override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean {
                // 退到后台时只暂停输出，虚拟屏和游戏继续存活；回来后 Available 会再次 attach
                ServiceClient.service?.let { s -> thread { try { s.setSurface(null) } catch (_: Throwable) {} } }
                surface?.release(); surface = null
                return true
            }

            // ---------------- 触摸转发 ----------------

            private fun forwardTouch(v: View, ev: MotionEvent) {
                val svc = ServiceClient.service ?: return
                val id = displayId
                if (id < 0 || v.width == 0 || v.height == 0) return

                val sx = vdW.toFloat() / v.width
                val sy = vdH.toFloat() / v.height
                val n = ev.pointerCount
                val props = Array(n) { i -> MotionEvent.PointerProperties().also { ev.getPointerProperties(i, it) } }
                val coords = Array(n) { i ->
                    MotionEvent.PointerCoords().also {
                        ev.getPointerCoords(i, it)
                        it.x = it.x * sx
                        it.y = it.y * sy
                    }
                }
                val out = MotionEvent.obtain(
                    ev.downTime, ev.eventTime, ev.action, n, props, coords,
                    ev.metaState, ev.buttonState, 1f, 1f, ev.deviceId, ev.edgeFlags,
                    InputDevice.SOURCE_TOUCHSCREEN, ev.flags
                )
                try { svc.injectTouch(id, out) } catch (_: Throwable) {} finally { out.recycle() }
            }

            // ---------------- 菜单 / 按键 ----------------

            private fun showMenu() {
                AlertDialog.Builder(this)
                    .setItems(arrayOf("发送返回键", "停止并退出", "取消")) { _, which ->
                        when (which) {
                            0 -> sendKey(KeyEvent.KEYCODE_BACK)
                            1 -> stopAndExit()
                        }
                    }.show()
            }

            private fun sendKey(code: Int) {
                val id = displayId; val s = ServiceClient.service ?: return
                if (id >= 0) thread { try { s.injectKey(id, code) } catch (_: Throwable) {} }
            }

            @Deprecated("Deprecated in Java")
            override fun onBackPressed() = sendKey(KeyEvent.KEYCODE_BACK)   // 返回键交给游戏

            private fun stopAndExit() {
                val s = ServiceClient.service
                thread {
                    try { s?.releaseDisplay() } catch (_: Throwable) {}
                    runOnUiThread { finish() }
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                if (isFinishing) {
                    val s = ServiceClient.service
                    thread { try { s?.releaseDisplay() } catch (_: Throwable) {} }
                }
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/service/FakeContext.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/service/FakeContext.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.service

        import android.content.Context
        import android.content.ContextWrapper
        import android.os.Looper

        /**
         * 在 Shizuku 的 shell 进程（不是普通 App 进程）里没有 Application Context。
         * 这里仿照 scrcpy：手动造一个 ActivityThread，拿到 SystemContext，
         * 再包一层，把包名伪装成 com.android.shell。
         */
        class FakeContext private constructor(base: Context) : ContextWrapper(base) {
            override fun getPackageName(): String = "com.android.shell"
            override fun getOpPackageName(): String = "com.android.shell"
            override fun getApplicationContext(): Context = this

            companion object {
                fun create(): Context {
                    if (Looper.myLooper() == null) {
                        try { Looper.prepareMainLooper() } catch (e: Throwable) { Looper.prepare() }
                    }
                    val atClass = Class.forName("android.app.ActivityThread")
                    var at = atClass.getDeclaredMethod("currentActivityThread").invoke(null)
                    if (at == null) {
                        val ctor = atClass.getDeclaredConstructor().apply { isAccessible = true }
                        at = ctor.newInstance()
                        atClass.getDeclaredField("sCurrentActivityThread")
                            .apply { isAccessible = true }.set(null, at)
                        atClass.getDeclaredField("mSystemThread")
                            .apply { isAccessible = true }.setBoolean(at, true)
                    }
                    val sys = atClass.getDeclaredMethod("getSystemContext").invoke(at) as Context
                    return FakeContext(sys)
                }
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/service/InputInjector.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/service/InputInjector.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.service

        import android.os.IBinder
        import android.os.SystemClock
        import android.view.InputDevice
        import android.view.InputEvent
        import android.view.KeyCharacterMap
        import android.view.KeyEvent
        import android.view.MotionEvent

        /**
         * 通过 IInputManager.injectInputEvent 向指定 displayId 注入事件。
         * 只有 shell/system uid 才有 INJECT_EVENTS 权限，所以必须在 Shizuku 进程里跑。
         */
        class InputInjector {
            private val iInputManager: Any
            private val injectMethod: java.lang.reflect.Method
            private val setDisplayId: java.lang.reflect.Method =
                InputEvent::class.java.getMethod("setDisplayId", Int::class.javaPrimitiveType)

            init {
                val binder = Class.forName("android.os.ServiceManager")
                    .getMethod("getService", String::class.java)
                    .invoke(null, "input") as IBinder
                iInputManager = Class.forName("android.hardware.input.IInputManager\$Stub")
                    .getMethod("asInterface", IBinder::class.java)
                    .invoke(null, binder)!!
                injectMethod = Class.forName("android.hardware.input.IInputManager")
                    .getMethod("injectInputEvent", InputEvent::class.java, Int::class.javaPrimitiveType)
            }

            private fun inject(ev: InputEvent, displayId: Int) {
                setDisplayId.invoke(ev, displayId)
                injectMethod.invoke(iInputManager, ev, 0 /* INJECT_INPUT_EVENT_MODE_ASYNC */)
            }

            fun touch(displayId: Int, ev: MotionEvent) {
                try {
                    ev.source = InputDevice.SOURCE_TOUCHSCREEN
                    inject(ev, displayId)
                } finally {
                    ev.recycle()
                }
            }

            fun key(displayId: Int, keyCode: Int) {
                val now = SystemClock.uptimeMillis()
                for (action in intArrayOf(KeyEvent.ACTION_DOWN, KeyEvent.ACTION_UP)) {
                    val e = KeyEvent(
                        now, now, action, keyCode, 0, 0,
                        KeyCharacterMap.VIRTUAL_KEYBOARD, 0, 0, InputDevice.SOURCE_KEYBOARD
                    )
                    inject(e, displayId)
                }
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/service/StretchService.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/service/StretchService.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.service

        import android.hardware.display.DisplayManager
        import android.hardware.display.VirtualDisplay
        import android.os.Build
        import android.util.Log
        import android.view.MotionEvent
        import android.view.Surface
        import com.example.stretchbox.IStretchService
        import kotlin.system.exitProcess

        /**
         * Shizuku UserService：运行在 shell uid 的独立进程中。
         * 职责：1) 创建虚拟屏  2) 把游戏启动到虚拟屏  3) 向虚拟屏注入触摸/按键
         */
        class StretchService : IStretchService.Stub() {

            private companion object {
                const val TAG = "StretchService"

                // VirtualDisplay 的 flag（部分是 hidden API，数值固定）
                const val FLAG_PUBLIC = 1 shl 0
                const val FLAG_OWN_CONTENT_ONLY = 1 shl 3
                const val FLAG_SUPPORTS_TOUCH = 1 shl 6
                const val FLAG_DESTROY_CONTENT_ON_REMOVAL = 1 shl 8
                const val FLAG_TRUSTED = 1 shl 10
                const val FLAG_OWN_DISPLAY_GROUP = 1 shl 11
                const val FLAG_ALWAYS_UNLOCKED = 1 shl 12
                const val FLAG_OWN_FOCUS = 1 shl 14
            }

            private var initError: String? = null
            private var displayManager: DisplayManager? = null
            private var injector: InputInjector? = null
            private var vd: VirtualDisplay? = null
            private var prevForceResizable: String? = null

            init {
                // 构造函数在 Shizuku 的主线程执行，这里初始化 hidden API 相关对象
                try {
                    val ctx = FakeContext.create()
                    val ctor = DisplayManager::class.java.getDeclaredConstructor(android.content.Context::class.java)
                        .apply { isAccessible = true }
                    displayManager = ctor.newInstance(ctx)
                } catch (t: Throwable) {
                    initError = "DisplayManager 初始化失败: $t"; Log.e(TAG, initError!!, t)
                }
                try {
                    injector = InputInjector()
                } catch (t: Throwable) {
                    Log.e(TAG, "InputInjector 初始化失败", t)
                }
            }

            private fun sh(vararg cmd: String): String = try {
                val p = ProcessBuilder(*cmd).redirectErrorStream(true).start()
                val out = p.inputStream.bufferedReader().readText()
                p.waitFor()
                out.trim()
            } catch (t: Throwable) { "ERR: $t" }
            /** Android 14+：请求高刷新率；失败返回 null，调用方会回退到普通创建方式 */
            private fun createWithRefreshRate(
                dm: DisplayManager, width: Int, height: Int, dpi: Int, refreshRate: Float, surface: Surface?, flags: Int
            ): VirtualDisplay? {
                if (Build.VERSION.SDK_INT < 34) return null
                return try {
                    val rate = if (refreshRate > 0f) refreshRate else (dm.getDisplay(0)?.refreshRate ?: return null)
                    if (rate <= 60.5f) return null
                    val bCls = Class.forName("android.hardware.display.VirtualDisplayConfig\$Builder")
                    val i = Int::class.javaPrimitiveType
                    val b = bCls.getConstructor(String::class.java, i, i, i).newInstance("StretchBox", width, height, dpi)
                    bCls.getMethod("setFlags", i).invoke(b, flags)
                    bCls.getMethod("setSurface", Surface::class.java).invoke(b, surface)
                    bCls.getMethod("setRequestedRefreshRate", Float::class.javaPrimitiveType).invoke(b, rate)
                    val cfg = bCls.getMethod("build").invoke(b)
                    val cfgCls = Class.forName("android.hardware.display.VirtualDisplayConfig")
                    val m = DisplayManager::class.java.declaredMethods
                        .filter { it.name == "createVirtualDisplay" && it.parameterTypes.any { p -> p == cfgCls } }
                        .minByOrNull { it.parameterCount } ?: return null
                    m.isAccessible = true
                    val args = m.parameterTypes.map { if (it == cfgCls) cfg else null }.toTypedArray()
                    m.invoke(dm, *args) as? VirtualDisplay
                } catch (t: Throwable) {
                    Log.e(TAG, "高刷新率创建失败，回退", t); null
                }
            }
            // ---------------- 虚拟屏 ----------------

            @Synchronized
            override fun createDisplay(width: Int, height: Int, dpi: Int, refreshRate: Float, surface: Surface?): Int {
                vd?.let { // 已存在：复用，只换 Surface / 尺寸
                    it.surface = surface
                    it.resize(width, height, dpi)
                    return it.display.displayId
                }
                val dm = displayManager ?: throw IllegalStateException(initError ?: "DisplayManager 不可用")

                var flags = FLAG_PUBLIC or FLAG_OWN_CONTENT_ONLY or FLAG_SUPPORTS_TOUCH or
                        FLAG_DESTROY_CONTENT_ON_REMOVAL
                if (Build.VERSION.SDK_INT >= 33) {
                    flags = flags or FLAG_TRUSTED or FLAG_OWN_DISPLAY_GROUP or FLAG_ALWAYS_UNLOCKED or FLAG_OWN_FOCUS
                }

                val d = createWithRefreshRate(dm, width, height, dpi, refreshRate, surface, flags) ?: dm.createVirtualDisplay("StretchBox", width, height, dpi, surface, flags)
                    ?: throw IllegalStateException("createVirtualDisplay 返回 null")
                vd = d

                // 让不可缩放(resizeableActivity=false)的游戏也能铺满虚拟屏
                prevForceResizable = sh("settings", "get", "global", "force_resizable_activities")
                sh("settings", "put", "global", "force_resizable_activities", "1")
                return d.display.displayId
            }

            @Synchronized
            override fun resizeDisplay(width: Int, height: Int, dpi: Int) {
                vd?.resize(width, height, dpi)
            }

            @Synchronized
            override fun setSurface(surface: Surface?) {
                vd?.surface = surface
            }

            @Synchronized
            override fun releaseDisplay() {
                vd?.release()
                vd = null
                prevForceResizable?.let {
                    if (it == "null" || it.isEmpty()) sh("settings", "delete", "global", "force_resizable_activities")
                    else sh("settings", "put", "global", "force_resizable_activities", it)
                }
                prevForceResizable = null
            }

            // ---------------- 启动游戏 ----------------

            override fun launch(pkg: String, displayId: Int, forceStop: Boolean): String {
                if (forceStop) sh("am", "force-stop", pkg)
                val resolved = sh(
                    "cmd", "package", "resolve-activity", "--brief",
                    "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER", pkg
                )
                val component = resolved.lines().map { it.trim() }.lastOrNull { it.contains('/') && !it.contains(' ') }
                    ?: return "找不到启动 Activity: $resolved"
                return sh("am", "start", "--display", displayId.toString(), "-n", component)
            }

            // ---------------- 输入 ----------------

            override fun injectTouch(displayId: Int, event: MotionEvent) {
                val inj = injector
                if (inj == null) { event.recycle(); return }
                try { inj.touch(displayId, event) } catch (t: Throwable) { Log.e(TAG, "injectTouch", t) }
            }

            override fun injectKey(displayId: Int, keyCode: Int) {
                try { injector?.key(displayId, keyCode) } catch (t: Throwable) { Log.e(TAG, "injectKey", t) }
            }

            override fun destroy() {
                releaseDisplay()
                exitProcess(0)
            }
        }
        STRETCH_EOF
