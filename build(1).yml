            private fun onOutputSurfaceReady(s: Surface) {
                outputSurface = s
                ServiceClient.whenReady { svc ->
                    thread {
                        try {
                            val maxHz = display?.supportedModes?.maxOfOrNull { it.refreshRate } ?: 0f
                            val t0 = System.currentTimeMillis()
                            while (System.currentTimeMillis() - t0 < 3000 && (display?.refreshRate ?: 0f) < maxHz - 1f) {
                                Thread.sleep(100)
                            }
                            // 陀螺仪修复模式：竖屏创建虚拟屏，让游戏按 90° 补偿传感器
                            val dispW: Int
                            val dispH: Int
                            if (gyroFix) { dispW = vdH; dispH = vdW } else { dispW = vdW; dispH = vdH }
                            val first = !launched
                            svc.configure(gyroFix)
                            displayId = svc.createDisplay(dispW, dispH, dpi, hz.toFloat(), s)
                            if (gyroFix) {
