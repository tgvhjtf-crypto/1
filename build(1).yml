                    add("陀螺仪方向反转：" + (if (gyroInvert) "开" else "关") + "（视角方向反了就点这里）") {
                        gyroInvert = !gyroInvert
                        prefs.edit().putBoolean("gyroInvert", gyroInvert).apply()
                        applyVdRotation()
                    }
