                    .setTitle("画面调节")
                    .setView(ScrollView(this).apply { addView(root) })
                    .setPositiveButton("完成") { _, _ -> saveColors() }
                    .show()
            }

            private fun applyColors() {
                renderer.setColors(colorAdj[0], colorAdj[1], colorAdj[2], colorAdj[3])
                renderer.setSharpness(colorAdj[4])
                glView.requestRender()
            }

            private fun saveColors() {
                val e = prefs.edit()
                for (i in 0..4) e.putFloat("adj$i", colorAdj[i])
                e.apply()
            }

            // ---------------- 按键 / 退出 ----------------

            private fun sendKey(code: Int) {
                val id = displayId; val s = ServiceClient.service ?: return
                if (id >= 0) thread { try { s.injectKey(id, code) } catch (_: Throwable) {} }
            }

            @Deprecated("Deprecated in Java")
            override fun onBackPressed() = sendKey(KeyEvent.KEYCODE_BACK)

            private fun stopAndExit() {
                val s = ServiceClient.service
                thread {
                    try { s?.releaseDisplay() } catch (_: Throwable) {}
                    runOnUiThread { finish() }
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                try { dm?.unregisterDisplayListener(displayListener) } catch (_: Throwable) {}
                if (isFinishing) {
                    val s = ServiceClient.service
                    thread { try { s?.releaseDisplay() } catch (_: Throwable) {} }
                }
            }
               
