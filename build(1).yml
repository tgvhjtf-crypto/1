        package com.example.stretchbox

        import android.graphics.SurfaceTexture
        import android.opengl.GLES11Ext
        import android.opengl.GLES20
        import android.opengl.GLSurfaceView
        import android.view.Surface
        import java.nio.ByteBuffer
        import java.nio.ByteOrder
        import java.nio.FloatBuffer
        import javax.microedition.khronos.egl.EGLConfig
        import javax.microedition.khronos.opengles.GL10

        /**
         * 用 OpenGL 把虚拟屏的 SurfaceTexture 画到全屏。
         * 支持：明度/对比度/饱和度/色温、锐化、上下/左右翻转、0/90/180/270 旋转（陀螺仪修复模式用）。
         */
        class StretchRenderer(
            private val bufW: Int,
            private val bufH: Int,
            private val onSurfaceReady: (Surface) -> Unit
        ) : GLSurfaceView.Renderer, SurfaceTexture.OnFrameAvailableListener {

            private var surfaceTexture: SurfaceTexture? = null
            private var surface: Surface? = null
            private var view: GLSurfaceView? = null
            private var program = 0
            private var texId = 0

            @Volatile private var brightness = 0f
            @Volatile private var contrast = 0f
            @Volatile private var saturation = 0f
            @Volatile private var warmth = 0f
            @Volatile private var sharp = 0f
            @Volatile private var rotation = 0
            @Volatile private var flipV = false
            @Volatile private var flipH = false

            private val texMatrix = FloatArray(16)
            private val quadData = FloatArray(8)
            private val quad: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)
            private val texCoords: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)

            private fun newFloatBuffer(vararg v: Float): FloatBuffer =
                ByteBuffer.allocateDirect(v.size * 4).order(ByteOrder.nativeOrder())
                    .asFloatBuffer().apply { put(v); position(0) }

            fun setView(v: GLSurfaceView) { view = v }

            fun setColors(b: Float, c: Float, s: Float, w: Float) {
                brightness = b; contrast = c; saturation = s; warmth = w
            }

            /** 锐化强度 0..1 */
            fun setSharpness(v: Float) { sharp = v }

            /** 缓冲区内容相对于显示方向的旋转：Display.getRotation() 的值 0..3 */
            fun setRotation(r: Int) { rotation = r and 3 }

            fun setFlip(h: Boolean, v: Boolean) { flipH = h; flipV = v }

            override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                surfaceTexture?.release()
                surface?.release()
                surfaceTexture = null
                surface = null

                program = buildProgram(VERT, FRAG)
                val ids = IntArray(1)
                GLES20.glGenTextures(1, ids, 0)
                texId = ids[0]
                GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, texId)
                GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)

                val st = SurfaceTexture(texId)
                st.setDefaultBufferSize(bufW, bufH)
                st.setOnFrameAvailableListener(this)
                surfaceTexture = st
                val s = Surface(st)
                surface = s
                onSurfaceReady(s)
            }

            override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                GLES20.glViewport(0, 0, width, height)
            }

            override fun onDrawFrame(gl: GL10?) {
                val st = surfaceTexture ?: return
                GLES20.glClearColor(0f, 0f, 0f, 1f)
                GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)
                try { st.updateTexImage() } catch (_: Throwable) { return }
                st.getTransformMatrix(texMatrix)

                // 顶点顺序：左下、右下、左上、右上。翻转 = 交换顶点位置，画面内容不变
                val x0 = if (flipH) 1f else -1f
                val y0 = if (flipV) 1f else -1f
                quadData[0] = x0;  quadData[1] = y0
                quadData[2] = -x0; quadData[3] = y0
                quadData[4] = x0;  quadData[5] = -y0
                quadData[6] = -x0; quadData[7] = -y0
                quad.position(0); quad.put(quadData); quad.position(0)
                texCoords.position(0); texCoords.put(TEX[rotation and 3]); texCoords.position(0)

                GLES20.glUseProgram(program)
                GLES20.glUniformMatrix4fv(GLES20.glGetUniformLocation(program, "uTexMatrix"), 1, false, texMatrix, 0)
                GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uBrightness"), brightness)
                GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uContrast"), contrast)
                GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uSaturation"), saturation)
                GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uWarmth"), warmth)
                GLES20.glUniform1f(GLES20.glGetUniformLocation(program, "uSharp"), sharp)
                GLES20.glUniform2f(GLES20.glGetUniformLocation(program, "uTexel"), 1f / bufW, 1f / bufH)

                val aPos = GLES20.glGetAttribLocation(program, "aPos")
                val aUV = GLES20.glGetAttribLocation(program, "aUV")
                GLES20.glEnableVertexAttribArray(aPos)
                GLES20.glVertexAttribPointer(aPos, 2, GLES20.GL_FLOAT, false, 0, quad)
                GLES20.glEnableVertexAttribArray(aUV)
                GLES20.glVertexAttribPointer(aUV, 2, GLES20.GL_FLOAT, false, 0, texCoords)
                GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
            }

            override fun onFrameAvailable(st: SurfaceTexture) {
                view?.requestRender()
            }

            private fun buildProgram(vs: String, fs: String): Int {
                fun compile(type: Int, src: String): Int {
                    val id = GLES20.glCreateShader(type)
                    GLES20.glShaderSource(id, src)
                    GLES20.glCompileShader(id)
                    return id
                }
                val v = compile(GLES20.GL_VERTEX_SHADER, vs)
                val f = compile(GLES20.GL_FRAGMENT_SHADER, fs)
                val p = GLES20.glCreateProgram()
                GLES20.glAttachShader(p, v)
                GLES20.glAttachShader(p, f)
                GLES20.glLinkProgram(p)
                return p
            }

            companion object {
                /**
                 * 四个顶点（左下、右下、左上、右上）对应的纹理坐标，按旋转 0/90/180/270 取。
                 * 旋转 0 是标准 SurfaceTexture 写法（左下=(0,0)），系统给的 uTexMatrix 已含一次上下翻转，
                 * 所以这里不能再预先翻转，否则画面会上下颠倒。
                 */
                private val TEX = arrayOf(
                    floatArrayOf(0f, 0f, 1f, 0f, 0f, 1f, 1f, 1f),
                    floatArrayOf(0f, 1f, 0f, 0f, 1f, 1f, 1f, 0f),
                    floatArrayOf(1f, 1f, 0f, 1f, 1f, 0f, 0f, 0f),
                    floatArrayOf(1f, 0f, 1f, 1f, 0f, 0f, 0f, 1f)
                )

                private const val VERT = """
        attribute vec4 aPos;
        attribute vec2 aUV;
        uniform mat4 uTexMatrix;
        varying vec2 vUV;
        void main() { gl_Position = aPos; vUV = (uTexMatrix * vec4(aUV, 0.0, 1.0)).xy; }
        """

                private const val FRAG = """
        #extension GL_OES_EGL_image_external : require
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform samplerExternalOES sTex;
        uniform float uBrightness;
        uniform float uContrast;
        uniform float uSaturation;
        uniform float uWarmth;
        uniform float uSharp;
        uniform vec2 uTexel;
        varying vec2 vUV;
        void main() {
            vec3 rgb = texture2D(sTex, vUV).rgb;
            if (uSharp > 0.001) {
                vec3 n = texture2D(sTex, vUV + vec2(uTexel.x, 0.0)).rgb
                       + texture2D(sTex, vUV - vec2(uTexel.x, 0.0)).rgb
                       + texture2D(sTex, vUV + vec2(0.0, uTexel.y)).rgb
                       + texture2D(sTex, vUV - vec2(0.0, uTexel.y)).rgb;
                rgb = rgb + (rgb * 4.0 - n) * uSharp * 0.6;
            }
            rgb = rgb + uBrightness;
            rgb = (rgb - 0.5) * (1.0 + uContrast) + 0.5;
            float g = dot(rgb, vec3(0.299, 0.587, 0.114));
            rgb = mix(vec3(g), rgb, 1.0 + uSaturation);
            rgb.r += uWarmth * 0.12;
            rgb.b -= uWarmth * 0.12;
            gl_FragColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
        }
        """
            }
        }
        STRETCH_EOF
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/StretchActivity.kt' <<'STRETCH_EOF'
        package com.example.stretchbox

        import android.app.Activity
        import android.app.AlertDialog
        import android.content.Context
        import android.graphics.Color
        import android.graphics.Point
        import android.hardware.display.DisplayManager
        import android.opengl.GLSurfaceView
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.view.Gravity
        import android.view.InputDevice
        import android.view.KeyEvent
        import android.view.MotionEvent
        import android.view.Surface
        import android.view.View
        import android.view.ViewGroup
        import android.view.WindowInsets
        import android.view.WindowManager
        import android.widget.AdapterView
        import android.widget.ArrayAdapter
        import android.widget.FrameLayout
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.SeekBar
        import android.widget.Spinner
        import android.widget.TextView
        import android.widget.Toast
        import kotlin.concurrent.thread
        import kotlin.math.roundToInt

        /**
         * 容器界面：
         *  - GLSurfaceView 铺满全屏，用 OpenGL 把虚拟屏画面画出来（缓冲区比例 ≠ 屏幕比例 ⇒ 强制拉伸）
         *  - GL 渲染支持明度/对比度/饱和度/色温和滤镜
         *  - 触摸按 虚拟屏尺寸 / 控件尺寸 缩放后注入虚拟屏
         */
        class StretchActivity : Activity() {

            companion object {
                const val EXTRA_PKG = "pkg"
                const val EXTRA_W = "w"
                const val EXTRA_H = "h"
                const val EXTRA_DPI = "dpi"
                const val EXTRA_HZ = "hz"
                const val EXTRA_FORCE_STOP = "force"
                const val EXTRA_SHOW_MENU = "showMenu"
                const val EXTRA_GYRO_FIX = "gyroFix"
            }

            private lateinit var glView: GLSurfaceView
            private lateinit var renderer: StretchRenderer
            private lateinit var pkg: String
            private var vdW = 1920
            private var vdH = 1080
            private var dpi = 420
            private var hz = 0
            private var forceStop = true
            private var showMenuBtn = true
            private var gyroFix = false
            private var flipV = false
            private var flipH = false

            /** 虚拟屏当前的逻辑尺寸（陀螺仪修复模式下以它为准） */
            @Volatile private var logicalW = 0
            @Volatile private var logicalH = 0
            private var gyroLog = ""
            private var dm: DisplayManager? = null
            private val displayListener = object : DisplayManager.DisplayListener {
                override fun onDisplayAdded(id: Int) {}
                override fun onDisplayRemoved(id: Int) {}
                override fun onDisplayChanged(id: Int) { if (id == displayId) syncDisplayState() }
            }

            @Volatile private var displayId = -1
            private var launched = false
            private var outputSurface: Surface? = null

            /** 明度/对比度/饱和度/色温，范围 -1..1；第 5 项是锐化，范围 0..1 */
            private val colorAdj = floatArrayOf(0f, 0f, 0f, 0f, 0f)

            private val prefs by lazy { getSharedPreferences("cfg", Context.MODE_PRIVATE) }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                pkg = intent.getStringExtra(EXTRA_PKG) ?: run { finish(); return }
                vdW = intent.getIntExtra(EXTRA_W, vdW)
                vdH = intent.getIntExtra(EXTRA_H, vdH)
                dpi = intent.getIntExtra(EXTRA_DPI, dpi)
                hz = intent.getIntExtra(EXTRA_HZ, 0)
                forceStop = intent.getBooleanExtra(EXTRA_FORCE_STOP, true)
                showMenuBtn = intent.getBooleanExtra(EXTRA_SHOW_MENU, true)
                gyroFix = intent.getBooleanExtra(EXTRA_GYRO_FIX, false)

                for (i in 0..4) colorAdj[i] = prefs.getFloat("adj$i", 0f)
                flipV = prefs.getBoolean("flipV", false)
                flipH = prefs.getBoolean("flipH", false)

                goImmersive()

                renderer = StretchRenderer(if (gyroFix) vdH else vdW, if (gyroFix) vdW else vdH) { s -> onOutputSurfaceReady(s) }
                renderer.setColors(colorAdj[0], colorAdj[1], colorAdj[2], colorAdj[3])
                renderer.setSharpness(colorAdj[4])
                renderer.setFlip(flipH, flipV)
                glView = GLSurfaceView(this).apply {
                    setEGLContextClientVersion(2)
                    preserveEGLContextOnPause = true
                    setRenderer(renderer)
                    renderMode = GLSurfaceView.RENDERMODE_WHEN_DIRTY
                    setOnTouchListener { v, ev -> forwardTouch(v, ev); true }
                }
                renderer.setView(glView)

                val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                root.addView(glView, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                if (showMenuBtn) {
                    val d = resources.displayMetrics.density
                    val menu = TextView(this).apply {
                        text = "⋮"; textSize = 20f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                        setBackgroundColor(0x55000000); alpha = 0.5f
                        setOnClickListener { showMenu() }
                    }
                    root.addView(menu, FrameLayout.LayoutParams((40 * d).roundToInt(), (40 * d).roundToInt(),
                        Gravity.TOP or Gravity.END).apply {
                        topMargin = (8 * d).roundToInt(); rightMargin = (8 * d).roundToInt()
                    })
                }

                setContentView(root)
                ServiceClient.bind(this)
            }

            private fun goImmersive() {
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                window.attributes = window.attributes.apply {
                    layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                    val cur = display?.mode
                    val best = display?.supportedModes
                        ?.filter { cur != null && it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
                        ?.maxByOrNull { it.refreshRate }
                    if (best != null) preferredDisplayModeId = best.modeId
                }
                window.setDecorFitsSystemWindows(false)
                window.decorView.windowInsetsController?.apply {
                    hide(WindowInsets.Type.systemBars())
                    systemBarsBehavior = android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                }
            }
            // ---------------- 虚拟屏生命周期 ----------------

            private fun onOutputSurfaceReady(s: Surface) {
                outputSurface = s
                ServiceClient.whenReady { svc ->
                    thread {
                        try {
                            val maxHz = display?.supportedModes?.maxOfOrNull { it.refreshRate } ?: 0f
                            val t0 = System.currentTimeMillis()
                            while (System.currentTimeMillis() - t0 < 3000 && (display?.refreshRate ?: 0f) < maxHz - 1f) {
                                Thread.sleep(100)
                            }
                            // 陀螺仪修复模式：竖屏创建虚拟屏，让游戏按 90° 补偿传感器
                            val dispW: Int
                            val dispH: Int
                            if (gyroFix) { dispW = vdH; dispH = vdW } else { dispW = vdW; dispH = vdH }
                            val first = !launched
                            svc.configure(gyroFix)
                            displayId = svc.createDisplay(dispW, dispH, dpi, hz.toFloat(), s)
                            if (gyroFix) {
                                // 锁定为横屏方向(1)，在启动游戏之前设置，避免游戏启动后再转屏
                                val rr = svc.setDisplayRotation(displayId, 1)
                                if (first) gyroLog = rr
                                runOnUiThread { startDisplayWatch() }
                            }
                            if (!launched) {
                                launched = true
                                val out = svc.launch(pkg, displayId, forceStop)
                                if (out.contains("Error", true) || out.startsWith("ERR") || out.startsWith("找不到"))
                                    runOnUiThread { Toast.makeText(this, out, Toast.LENGTH_LONG).show() }
                            }
                            if (gyroFix && first) {
                                Thread.sleep(2500)
                                runOnUiThread { showGyroDiag() }
                            }
                        } catch (t: Throwable) {
                            runOnUiThread { Toast.makeText(this, "创建虚拟屏失败: ${t.message}", Toast.LENGTH_LONG).show() }
                        }
                    }
                }
            }

            override fun onResume() {
                super.onResume()
                glView.onResume()   // GL 重建后会再给一个新 Surface，自动重新 attach
            }

            override fun onPause() {
                // 退到后台：只暂停输出，虚拟屏和游戏继续存活
                thread { try { ServiceClient.service?.setSurface(null) } catch (_: Throwable) {} }
                glView.onPause()
                super.onPause()
            }

            // ---------------- 触摸转发 ----------------

            private fun forwardTouch(v: View, ev: MotionEvent) {
                val svc = ServiceClient.service ?: return
                val id = displayId
                if (id < 0 || v.width == 0 || v.height == 0) return

                val lw = if (gyroFix && logicalW > 0) logicalW else vdW
                val lh = if (gyroFix && logicalH > 0) logicalH else vdH
                val sx = lw.toFloat() / v.width
                val sy = lh.toFloat() / v.height
                val n = ev.pointerCount
                val props = Array(n) { i -> MotionEvent.PointerProperties().also { ev.getPointerProperties(i, it) } }
                val coords = Array(n) { i ->
                    MotionEvent.PointerCoords().also {
                        ev.getPointerCoords(i, it)
                        it.x = (if (flipH) v.width - it.x else it.x) * sx
                        it.y = (if (flipV) v.height - it.y else it.y) * sy
                    }
                }
                val out = MotionEvent.obtain(
                    ev.downTime, ev.eventTime, ev.action, n, props, coords,
                    ev.metaState, ev.buttonState, 1f, 1f, ev.deviceId, ev.edgeFlags,
                    InputDevice.SOURCE_TOUCHSCREEN, ev.flags
                )
                try { svc.injectTouch(id, out) } catch (_: Throwable) {} finally { out.recycle() }
            }

            // ---------------- 菜单 / 画面调节 ----------------

            private fun showMenu() {
                val items = arrayOf(
                    "画面调节（明度/对比度/滤镜/锐化）",
                    "上下翻转画面：" + (if (flipV) "开" else "关"),
                    "左右翻转画面：" + (if (flipH) "开" else "关"),
                    "发送返回键", "停止并退出", "取消"
                )
                AlertDialog.Builder(this)
                    .setItems(items) { _, which ->
                        when (which) {
                            0 -> showColorDialog()
                            1 -> { flipV = !flipV; applyFlip() }
                            2 -> { flipH = !flipH; applyFlip() }
                            3 -> sendKey(KeyEvent.KEYCODE_BACK)
                            4 -> stopAndExit()
                        }
                    }.show()
            }

            private fun applyFlip() {
                renderer.setFlip(flipH, flipV)
                glView.requestRender()
                prefs.edit().putBoolean("flipV", flipV).putBoolean("flipH", flipH).apply()
            }

            // ---------------- 陀螺仪修复：跟踪虚拟屏旋转 ----------------

            private fun startDisplayWatch() {
                if (dm == null) {
                    dm = getSystemService(DisplayManager::class.java)
                    dm?.registerDisplayListener(displayListener, Handler(Looper.getMainLooper()))
                }
                syncDisplayState()
            }

            @Suppress("DEPRECATION")
            private fun syncDisplayState() {
                val d = dm?.getDisplay(displayId) ?: return
                val p = Point()
                d.getRealSize(p)
                logicalW = p.x
                logicalH = p.y
                if (gyroFix) {
                    renderer.setRotation(d.rotation)
                    glView.requestRender()
                }
            }

            private fun showGyroDiag() {
                syncDisplayState()
                val d = dm?.getDisplay(displayId)
                val msg = "虚拟屏旋转 = ${d?.rotation}（1 或 3 才是横屏）\n" +
                    "逻辑尺寸 = ${logicalW}x${logicalH}\n" +
                    "锁定旋转命令输出：${if (gyroLog.isEmpty()) "（无输出=成功）" else gyroLog}"
                AlertDialog.Builder(this).setTitle("陀螺仪修复诊断").setMessage(msg)
                    .setPositiveButton("确定", null).show()
            }

            private fun showColorDialog() {
                val names = arrayOf("明度", "对比度", "饱和度", "色温")
                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(40, 20, 40, 0)
                }
                val seeks = Array(4) { i ->
                    SeekBar(this).apply {
                        max = 200
                        progress = ((colorAdj[i] + 1f) * 100).roundToInt()
                        setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                            override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                                colorAdj[i] = p / 100f - 1f
                                applyColors()
                            }
                            override fun onStartTrackingTouch(sb: SeekBar?) {}
                            override fun onStopTrackingTouch(sb: SeekBar?) {}
                        })
                    }
                }
                for (i in 0..3) {
                    root.addView(TextView(this).apply { text = names[i] })
                    root.addView(seeks[i])
                }

                root.addView(TextView(this).apply { text = "锐化（画面发糊时往右拉）" })
                root.addView(SeekBar(this).apply {
                    max = 100
                    progress = (colorAdj[4] * 100).roundToInt()
                    setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                        override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                            colorAdj[4] = p / 100f
                            applyColors()
                        }
                        override fun onStartTrackingTouch(sb: SeekBar?) {}
                        override fun onStopTrackingTouch(sb: SeekBar?) {}
                    })
                })

                val filters = listOf("无", "夜间护眼", "冷色调", "黑白", "鲜艳")
                val sp = Spinner(this)
                sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, filters)
                var initial = true   // Spinner 刚显示时会自动回调一次，必须跳过，否则会把已保存的调节清零
                sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                    override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                        if (initial) { initial = false; return }
                        val preset = when (pos) {
                            1 -> floatArrayOf(-0.08f, 0f, -0.1f, 0.8f)
                            2 -> floatArrayOf(0f, 0f, 0f, -0.6f)
                            3 -> floatArrayOf(0f, 0f, -1f, 0f)
                            4 -> floatArrayOf(0f, 0.1f, 0.4f, 0f)
                            else -> floatArrayOf(0f, 0f, 0f, 0f)
                        }
                        for (i in 0..3) {
                            colorAdj[i] = preset[i]
                            seeks[i].progress = ((preset[i] + 1f) * 100).roundToInt()
                        }
                        applyColors()
                    }
                    override fun onNothingSelected(p: AdapterView<*>?) {}
                }
                root.addView(TextView(this).apply { text = "滤镜" })
                root.addView(sp)

                AlertDialog.Builder(this)
                    .setTitle("画面调节")
                    .setView(ScrollView(this).apply { addView(root) })
                    .setPositiveButton("完成") { _, _ -> saveColors() }
                    .show()
            }

            private fun applyColors() {
                renderer.setColors(colorAdj[0], colorAdj[1], colorAdj[2], colorAdj[3])
                renderer.setSharpness(colorAdj[4])
                glView.requestRender()
            }

            private fun saveColors() {
                val e = prefs.edit()
                for (i in 0..4) e.putFloat("adj$i", colorAdj[i])
                e.apply()
            }
            // ---------------- 按键 / 退出 ----------------

            private fun sendKey(code: Int) {
                val id = displayId; val s = ServiceClient.service ?: return
                if (id >= 0) thread { try { s.injectKey(id, code) } catch (_: Throwable) {} }
            }

            @Deprecated("Deprecated in Java")
            override fun onBackPressed() = sendKey(KeyEvent.KEYCODE_BACK)

            private fun stopAndExit() {
                val s = ServiceClient.service
                thread {
                    try { s?.releaseDisplay() } catch (_: Throwable) {}
                    runOnUiThread { finish() }
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                try { dm?.unregisterDisplayListener(displayListener) } catch (_: Throwable) {}
                if (isFinishing) {
                    val s = ServiceClient.service
                    thread { try { s?.releaseDisplay() } catch (_: Throwable) {} }
                }
            }
        }
