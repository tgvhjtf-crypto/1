            private fun forwardTouch(v: View, ev: MotionEvent) {
                  
                val svc = ServiceClient.service ?: return
                val id = displayId
                if (id < 0 || v.width == 0 || v.height == 0) return

                val lw = if (gyroFix && logicalW > 0) logicalW else vdW
                val lh = if (gyroFix && logicalH > 0) logicalH else vdH
                val sx = lw.toFloat() / v.width
                val sy = lh.toFloat() / v.height
                val n = ev.pointerCount
                val props = Array(n) { i -> MotionEvent.PointerProperties().also { ev.getPointerProperties(i, it) } }
                val coords = Array(n) { i ->
                    MotionEvent.PointerCoords().also {
                        ev.getPointerCoords(i, it)
                        it.x = (if (flipH) v.width - it.x else it.x) * sx
                        it.y = (if (flipV) v.height - it.y else it.y) * sy
                    }
                }
                val out = MotionEvent.obtain(
                    ev.downTime, ev.eventTime, ev.action, n, props, coords,
                    ev.metaState, ev.buttonState, 1f, 1f, ev.deviceId, ev.edgeFlags,
                    InputDevice.SOURCE_TOUCHSCREEN, ev.flags
                )
                try { svc.injectTouch(id, out) } catch (_: Throwable) {} finally { out.recycle() }
            }

