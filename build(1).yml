                    override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                        if (initial) { initial = false; return }
                        val preset = when (pos) {
                            1 -> floatArrayOf(-0.08f, 0f, -0.1f, 0.8f)
                            2 -> floatArrayOf(0f, 0f, 0f, -0.6f)
                            3 -> floatArrayOf(0f, 0f, -1f, 0f)
                            4 -> floatArrayOf(0f, 0.1f, 0.4f, 0f)
                            else -> floatArrayOf(0f, 0f, 0f, 0f)
                        }
                        for (i in 0..3) {
                            colorAdj[i] = preset[i]
                            seeks[i].progress = ((preset[i] + 1f) * 100).roundToInt()
                        }
                        applyColors()
                    }
                    override fun onNothingSelected(p: AdapterView<*>?) {}
                }
                root.addView(TextView(this).apply { text = "滤镜" })
                root.addView(sp)

